# Menerbitkan ekstensi VS Code Lokashaka tanpa token (trusted publishing / OIDC) ke dua toko:
#   - Open VSX   (openvsx)      : `ovsx publish --trusted-publishing`
#   - VS Code Marketplace (marketplace): `vsce publish --oidc`
# Jalankan: push tag `v<versi>` (mis. v1.0.6) -> menerbitkan ke KEDUA toko, atau tombol "Run workflow"
# di tab Actions dan pilih target (both, openvsx, marketplace).
# Versi di package.json harus belum pernah terbit di toko tujuan (nomor yang sama ditolak).
# Pendaftaran (pemilik, satu kali): Open VSX = trusted publisher (namespace lokashaka, GitHub, extension lokashaka,
# repo Lokashaka/lokashaka-extension, workflow publish-vsx.yml); Marketplace = trusted publishing policy di publisher
# lokashaka (GitHub Actions, owner Lokashaka, repo lokashaka-extension, workflow publish-vsx.yml).
name: Publish extension

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Toko tujuan"
        type: choice
        default: both
        options:
          - both
          - openvsx
          - marketplace
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  openvsx:
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'openvsx'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # token OIDC GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cek versi (tag harus sama dengan package.json)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Versi di package.json: $VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak sama dengan v${VERSION}"; exit 1
          fi
          test "$(ls media/characters | wc -l)" -ge 7
      - name: Kemas VSIX
        run: npx --yes @vscode/vsce package --allow-missing-repository --no-dependencies -o "${RUNNER_TEMP}/lokashaka.vsix"
      - name: Terbitkan ke Open VSX (trusted publishing)
        run: npx --yes ovsx@latest publish --trusted-publishing "${RUNNER_TEMP}/lokashaka.vsix"

  marketplace:
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'marketplace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # token OIDC GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cek versi (tag harus sama dengan package.json)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Versi di package.json: $VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak sama dengan v${VERSION}"; exit 1
          fi
          test "$(ls media/characters | wc -l)" -ge 7
      - name: Kemas VSIX
        run: npx --yes @vscode/vsce package --allow-missing-repository --no-dependencies -o "${RUNNER_TEMP}/lokashaka.vsix"
      - name: Terbitkan ke VS Code Marketplace (trusted publishing)
        run: npx --yes @vscode/vsce publish --oidc --packagePath "${RUNNER_TEMP}/lokashaka.vsix"
